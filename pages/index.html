<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Importar Excel de Field Test</title>

  <!-- ✅ IMPORT MAP OBLIGATORIO -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>
<body>

<h1>Importar Excel de Field Test</h1>

<form id="import-form">
  <input type="file" id="excel-file" accept=".xlsx" required />
  <button type="submit">Subir Excel</button>
</form>

<div id="import-status"></div>

<hr>

<input id="filter-bike" placeholder="Filtrar bici">
<input id="filter-motor" placeholder="Filtrar motor">

<table id="summary-table">
  <thead>
    <tr>
      <th>Bici</th>
      <th>Motor</th>
      <th>Km</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
  import "/dist/app/controllers/import.controller.js";
</script>

</body>
</html>
