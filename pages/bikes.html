<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bikes App</title>

  <!-- Supabase -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    .panel h3 {
      margin-top: 0;
    }

    .list-item {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .list-item:hover {
      background: #f0f0f0;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #125ca1;
    }

    input {
      padding: 6px;
      margin-bottom: 6px;
      width: 100%;
    }

    .history-item {
      font-size: 13px;
      border-bottom: 1px solid #eee;
      padding: 6px 0;
    }

    .component {
      font-weight: bold;
    }

    .note {
      color: #666;
      font-style: italic;
    }
  </style>
</head>

<body>

<input id="new-bike-code" placeholder="Código bici" />
<button id="create-bike">Crear bici</button>

  <h1>Bikes</h1>

  <div class="container">
    
    <!-- LISTA -->
    <div class="panel">
      <h3>Bicis</h3>
      <div id="bikes-list"></div>
    </div>

    <!-- DETALLE + FORM + HISTORY -->
    <div class="panel">
      <h3>Detalle</h3>
      <div id="bike-detail"></div>

      <h3>Formulario</h3>
      <div id="bike-form"></div>

      <h3>Histórico</h3>
      <div id="bike-history"></div>
    </div>

  </div>

  <!-- CONTROLLER -->
  <script type="module">
    import "/dist/app/controllers/bikes.controller.js";
  </script>

</body>
</html>
