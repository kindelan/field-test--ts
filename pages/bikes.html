<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bikes Manager - Premium</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase Import Map -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <style>
    /* ==========================================
       VARIABLES & BASE DESIGN SYSTEM
       ========================================== */
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-input: #1e293b;
      --border-color: #222e45;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --primary-hover: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      
      --transition-all: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 30px;
      line-height: 1.5;
    }

    /* ==========================================
       HEADER & NAVIGATION/CREATOR
       ========================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(to right, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .nav-container {
      display: flex;
      gap: 10px;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      transition: var(--transition-all);
      border: 1px solid transparent;
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
    }

    .nav-link.active {
      color: white;
      background: var(--primary-gradient);
      box-shadow: var(--shadow-md);
    }

    .creator-panel {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--bg-card);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }

    .creator-panel input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 180px;
      transition: var(--transition-all);
    }

    .creator-panel input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary-gradient);
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-all);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* ==========================================
       LAYOUT CONTAINER
       ========================================== */
    .app-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 30px;
      align-items: start;
    }

    /* ==========================================
       PANELS & CARDS
       ========================================== */
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      transition: var(--transition-all);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-all);
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent-red);
      transform: none;
    }

    /* ==========================================
       BIKE LIST (LEFT PANEL)
       ========================================== */
    .bike-list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Scrollbar */
    .bike-list-wrapper::-webkit-scrollbar,
    .history-list-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .bike-list-wrapper::-webkit-scrollbar-thumb,
    .history-list-wrapper::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .bike-item-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: var(--transition-all);
    }

    .bike-item-card:hover {
      background: rgba(99, 102, 241, 0.05);
      border-color: rgba(99, 102, 241, 0.4);
      transform: scale(1.01);
    }

    .bike-item-card.active {
      background: rgba(99, 102, 241, 0.1);
      border-color: #6366f1;
    }

    .bike-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .bike-item-code {
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
    }

    .bike-item-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .bike-item-badge.has-loc {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
    }

    .bike-item-badge.no-loc {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-secondary);
    }

    .bike-item-details {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ==========================================
       RIGHT PANEL (DETAILS / DYNAMIC)
       ========================================== */
    .details-area {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .placeholder-view {
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .placeholder-view svg {
      margin-bottom: 12px;
      color: var(--border-color);
    }

    /* Grid for details */
    .bike-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .meta-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
    }

    .meta-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .meta-card-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* Buttons block in details */
    .action-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .action-group button {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .action-group button:hover {
      background: var(--border-color);
      color: white;
    }

    .action-group button.primary-action {
      background: var(--primary-gradient);
      border: none;
      color: white;
    }

    .action-group button.primary-action:hover {
      background: var(--primary-hover);
    }

    /* ==========================================
       FORMS & INPUTS
       ========================================== */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    form input, form select, form textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: var(--transition-all);
      width: 100%;
    }

    form input:focus, form select:focus, form textarea:focus {
      border-color: #6366f1;
    }

    form textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    /* ==========================================
       TIMELINE / HISTORIC
       ========================================== */
    .history-list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      position: relative;
      padding-left: 20px;
      border-left: 2px solid var(--border-color);
      padding-bottom: 4px;
    }

    .history-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
      border: 2px solid var(--bg-card);
    }

    .history-item.component_change::before {
      background: var(--accent-amber);
    }

    .history-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .history-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .history-details {
      font-size: 13px;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .history-note {
      font-size: 12px;
      font-style: italic;
      color: var(--text-secondary);
      margin-top: 4px;
      display: block;
    }

    .search-filters {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .search-filters input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: var(--transition-all);
      width: 100%;
      box-sizing: border-box;
    }
    
    .search-filters input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <h1>Bikes Manager</h1>
      <nav class="nav-container">
        <a href="/bikes.html" class="nav-link active">Bicicletas</a>
        <a href="/ft.html" class="nav-link">Field Tests</a>
        <a href="/import.html" class="nav-link">Importar Excel</a>
        <a href="/finance.html" class="nav-link">Reporte Económico</a>
        <a href="/questions.html" class="nav-link">Preguntas Formulario</a>
        <a href="/form.html" class="nav-link">Rider Review</a>
        <button id="logout-btn" class="nav-link" style="background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--accent-red); cursor: pointer; font-family: inherit;">Cerrar Sesión</button>
      </nav>
    </div>
    
    <div class="creator-panel">
      <input id="new-bike-code" placeholder="Código de la bici..." />
      <button id="create-bike">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Crear bici
      </button>
    </div>
  </header>

  <div class="app-container">
    
    <!-- LISTA IZQUIERDA -->
    <div class="panel">
      <div class="panel-header">
        <h3>Bicicletas</h3>
      </div>
      <div class="search-filters">
        <input id="search-bike-code" placeholder="Filtrar por código de bici..." />
        <input id="search-motor-type" placeholder="Filtrar por tipo de motor..." />
      </div>
      <div id="bikes-list">
        <!-- Carga dinámica -->
      </div>
    </div>

    <!-- PANELES DINÁMICOS DERECHA -->
    <div class="details-area">
      
      <!-- DETALLE PRINCIPAL -->
      <div id="bike-detail" style="display: none;">
        <!-- Carga dinámica -->
      </div>

      <!-- FORMULARIO DINÁMICO (Editar o Cambiar componente) -->
      <div id="bike-form" style="display: none;">
        <!-- Carga dinámica -->
      </div>

      <!-- HISTÓRICO -->
      <div id="bike-history" style="display: none;">
        <!-- Carga dinámica -->
      </div>

      <!-- VISTA POR DEFECTO (Si no hay nada cargado) -->
      <div id="placeholder-view" class="placeholder-view">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p>Selecciona una bicicleta del listado para gestionar sus detalles, histórico de componentes y metadatos.</p>
      </div>

    </div>

  </div>

  <!-- CONTROLLER -->
  <script type="module">
    import "/dist/app/controllers/bikes.controller.js";
  </script>

</body>
</html>
